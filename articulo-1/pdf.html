<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Vista PDF</title>
    <style>
        /* Reseteo del navegador y activación forzada de scroll */
        html, body {
            margin: 0;
            padding: 0;
            background: #525659;
            overflow-y: auto; 
        }
        
        /* Contenedor flexible para apilar las páginas */
        .contenedor-paginas {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            padding: 20px 0;
        }

        /* Regla de ajuste para las imágenes */
        img {
            width: 95%; /* Obliga a la imagen a encajar en la pantalla */
            max-width: 600px; /* Límite máximo para que no se vea borrosa en monitores grandes */
            height: auto; /* Mantiene la proporción original sin distorsión */
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            display: block;
        }
    </style>
</head>
<body>
    <div class="contenedor-paginas">
        <img src="pagina1.png" alt="Página 1">
		<img src="pagina2.png" alt="Página 2">
		<img src="pagina3.png" alt="Página 3">
		<img src="pagina4.png" alt="Página 4">
		<img src="pagina5.png" alt="Página 5">
		<img src="pagina6.png" alt="Página 6">
		<img src="pagina7.png" alt="Página 7">
		<img src="pagina8.png" alt="Página 8">
		<img src="pagina9.png" alt="Página 9">
		<img src="pagina10.png" alt="Página 10">
		<img src="pagina11.png" alt="Página 11">
		<img src="pagina12.png" alt="Página 12">
		<img src="pagina13.png" alt="Página 13">
		<img src="pagina14.png" alt="Página 14">
		<img src="pagina15.png" alt="Página 15">
		<img src="pagina16.png" alt="Página 16">
		<img src="pagina17.png" alt="Página 17">
		<img src="pagina18.png" alt="Página 18">
        </div>
</body>
</html>
